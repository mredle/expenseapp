name: ExpenseApp Test Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This will spin up 3 parallel servers and test all 3 DBs simultaneously!
        database: [sqlite, mariadb, postgres] 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install testing extras
        pip install pytest pytest-cov

    - name: Run Test Script
      env:
        # Mock AWS keys for the S3 tests
        AWS_ACCESS_KEY_ID: testing_key
        AWS_SECRET_ACCESS_KEY: testing_secret
      # Pass the matrix database choice directly into your bash script!
      run: bash ./run_tests.sh ${{ matrix.database }}

  mobile:
    # Guards the mobile dependency tree. `npm ci` fails when package.json and
    # package-lock.json are out of sync AND when peer dependencies are
    # unsatisfiable, which is exactly how broken dependabot bumps used to reach
    # production (the server runs `npm ci` on every service start).
    name: mobile build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        # Must match production (NodeSource 22.x) and mobile/package.json
        # "engines" — npm 11+ resolves this Angular set differently.
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: mobile/package-lock.json

    - name: Install mobile dependencies
      working-directory: mobile
      # No --legacy-peer-deps / --force: a lockfile that needs them is broken.
      run: npm ci --include=dev --no-audit --no-fund

    - name: Build mobile app
      working-directory: mobile
      run: npm run build
