# Dependabot configuration.
#
# Goals:
#   1. Never split Angular's lockstep package families. The framework packages
#      peer-depend on each other with EXACT versions (@angular/animations@20.3.27
#      requires @angular/core@20.3.27), so bumping one on its own produces a tree
#      npm refuses to install — which took production down twice.
#   2. Keep PR volume manageable via grouping, a monthly schedule and a cap on
#      concurrent PRs.
#
# The primary defence is NOT this file: mobile/package.json uses ~20.3.0 ranges
# so npm can always resolve the whole family to one coherent patch level.
# Grouping alone is insufficient — a group only bundles updates that are
# actually available, so a lone security advisory on @angular/core would still
# bump just that package. With exact pins npm cannot move the siblings to match;
# with ranges it can.
#
# Patch and minor updates are deliberately NOT ignored: they carry the security
# fixes. Security updates are enabled in the repository settings and arrive
# regardless of the schedule below, which is why every group is duplicated with
# `applies-to: security-updates`.
#
# NOTE: groups only apply to PRs Dependabot creates AFTER this file is merged.
# Already-open PRs keep their previous ungrouped form and should be closed so
# they are recreated.

version: 2

updates:
  # ── Mobile (Ionic/Angular) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # With ~20.3.0 ranges an in-range patch only needs a lockfile update, so the
    # manifest stops churning on every Angular patch release.
    versioning-strategy: increase-if-necessary

    groups:
      # ---- version updates (the default for `applies-to`) ----
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        exclude-patterns:
          - "@angular-eslint/*"
      angular-eslint:
        patterns:
          - "@angular-eslint/*"
      ionic:
        patterns:
          - "@ionic/*"
          - "ionicons"
      capacitor:
        patterns:
          - "@capacitor/*"
      dev-dependencies:
        dependency-type: development

      # ---- security updates ----
      # Without these blocks security fixes are raised one PR per package, which
      # is exactly how the Angular family got split.
      # Order matters: the first matching group wins, so the catch-all is last.
      angular-security:
        applies-to: security-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        exclude-patterns:
          - "@angular-eslint/*"
      angular-eslint-security:
        applies-to: security-updates
        patterns:
          - "@angular-eslint/*"
      ionic-security:
        applies-to: security-updates
        patterns:
          - "@ionic/*"
          - "ionicons"
      capacitor-security:
        applies-to: security-updates
        patterns:
          - "@capacitor/*"
      # Collapses the transitive noise (fast-uri, undici, shell-quote,
      # socket.io-parser, …) into a single PR.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── Backend (Python) ──────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-packages:
        patterns:
          - "*"
      python-packages-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
