<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/admin"></ion-back-button></ion-buttons>
    <ion-title>Logs</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-label>Severity</ion-label>
    <ion-select [(ngModel)]="severity" (ionChange)="filterChange()" placeholder="All">
      <ion-select-option value="">All</ion-select-option>
      <ion-select-option value="ERROR">Error</ion-select-option>
      <ion-select-option value="WARNING">Warning</ion-select-option>
      <ion-select-option value="INFO">Info</ion-select-option>
    </ion-select>
  </ion-item>

  <div *ngIf="loading" class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>

  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let l of logs">
      <ion-badge slot="start" [color]="severityColor(l.severity)">{{ l.severity }}</ion-badge>
      <ion-label class="ion-text-wrap">
        <h2>{{ l.msg_type }} <ion-text color="medium">– {{ l.module }}</ion-text></h2>
        <p>{{ l.msg }}</p>
        <p><ion-text color="medium">{{ l.date | date:'medium' }} · {{ l.username }}</ion-text></p>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="logs.length === 0">
      <ion-label color="medium" class="ion-text-center">No logs.</ion-label>
    </ion-item>
  </ion-list>

  <ion-infinite-scroll (ionInfinite)="loadMore($event)" [disabled]="!hasNext">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
